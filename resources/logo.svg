<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" style="display: block;">
  <!-- App logo: black rounded square with a white circle holding a
       terminal prompt (chevron + underscore). Authored as vector so the
       app's svg/resvg render path stays crisp at every DPI, and every
       raster asset (logo_*.png, logo.ico, Oryxis.icns) is generated from
       this single source. -->
  <!-- Rounded square. Reference geometry: inset 100, size 824, corner
       radius ~175 on a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="175" ry="175" fill="rgb(11,11,12)"/>
  <!-- White circle, center (391, 631), radius 150. -->
  <circle cx="391" cy="631" r="150" fill="rgb(254,254,253)"/>
  <!-- Terminal prompt inside the circle, drawn in the square's black.
       Chevron ">" as a stroked polyline, underscore as a rounded bar. -->
  <g fill="none" stroke="rgb(11,11,12)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="330,571 400,631 330,691"/>
  </g>
  <rect x="405" y="676" width="70" height="30" rx="15" ry="15" fill="rgb(11,11,12)"/>
</svg>
